version: "3.9"

services:

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pagueares-db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SA_PASSWORD}"
      MSSQL_PID: "${MSSQL_PID:-Developer}"
    ports:
      - "${DB_PORT:-1433}:1433"
    volumes:
      - pagueares-db-data:/var/opt/mssql
    networks:
      - pagueares-net
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$SA_PASSWORD\" -Q 'SELECT 1' -C -l 30 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: pagueares-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      ASPNETCORE_URLS: "http://+:8080"
      # Double-underscore mapeia para ConnectionStrings:ConexaoPadrao no ASP.NET Core
      ConnectionStrings__ConexaoPadrao: "Server=db,1433;Database=PagueAres;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;Connection Timeout=30"
      JwtSettings__Secret: "${JWT_SECRET}"
      ASPNETCORE_RUN_MIGRATIONS: "${ASPNETCORE_RUN_MIGRATIONS:-true}"
    ports:
      - "${API_PORT:-5000}:8080"
    networks:
      - pagueares-net
    restart: on-failure

  frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: pagueares-frontend
    depends_on:
      - api
    environment:
      FRONTEND_API_BASE_URL: "${FRONTEND_API_BASE_URL:-}"
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - pagueares-net
    restart: unless-stopped

volumes:
  pagueares-db-data:

networks:
  pagueares-net:
    driver: bridge
