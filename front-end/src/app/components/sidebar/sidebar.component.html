<div class="logo">
  <a href="/home" class="simple-text">
    <div class="logo-img">
      <img src="/assets/img/angular2-logo-red.png" />
    </div>
  </a>
</div>

<form class="nav-quit">
  <div class="input-group no-border">
    <button
      class="btn btn-primary btn-sm btn-round"
      type="button"
      alt="Sair"
      href="../"
    >
      <i class="fa fa-power-off"></i>
    </button>
  </div>
</form>

<div class="sidebar-wrapper">
  <div class="user-data row">
    
    <div class="username col-md-8">
        <i class="material-icons">person</i> {{UserName}}
    </div>
    <div class="col-md-4 logout-area">
      <button class="logout" (click)="doLogout()"><i class="fa fa-power-off"></i></button>
    </div>

  </div>
  <ul class="nav">
    <li
      routerLinkActive="active"
      *ngFor="let menuItem of menuItems"
      class="{{ menuItem.class }} nav-item"
    >
      <a class="nav-link" [routerLink]="[menuItem.path]">
        <i class="material-icons">{{ menuItem.icon }}</i>
        <p>{{ menuItem.title }}</p>
      </a>
    </li>

    <!-- <a href="/src/app/login/login.component.html" class="simple-text"> -->

    <!-- <button mat-fab color="primary">
            <mat-icon>delete</mat-icon>
        </button> -->
  </ul>
</div>
